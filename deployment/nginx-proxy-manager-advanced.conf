# Nginx Proxy Manager: paste into THIS Nuvio Proxy Host's Advanced tab.
# Details: http -> ZIMA-IP:3075, Cache Assets OFF, dedicated hostname at /.
# SSL: a valid certificate for the hostname, Force SSL ON for direct HTTPS use.
# Do not paste into the global nginx.conf or create a second location / block.
proxy_http_version 1.1;
proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
proxy_connect_timeout 5s;
proxy_read_timeout 90s;
proxy_send_timeout 90s;

# Keep upstream no-store, Set-Cookie, range, and X-Accel-Buffering behavior.
# Do not add proxy_ignore_headers, wildcard CORS, or a cache-everything rule.
