worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Resolve on each connection cycle so companion restarts do not leave a stale container IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Addons and direct media have user-selected HTTP(S) origins. Auth remains in its Worker.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: blob:; font-src 'self' data:; connect-src 'self' https: http:; media-src 'self' https: http: blob:; frame-src https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /healthz { return 200 'ok'; }
    location ^~ /api/companion/ {
      set $companion http://companion:3101;
      proxy_pass $companion$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
    }
    location ~ ^/(?:sw\.js|workbox-[^/]+\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
      expires -1;
      try_files $uri =404;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
