name: Verify and publish personal self-hosted images
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm --prefix companion ci
      - run: npm run check && npm test && npm run build && npm --prefix companion run check
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: NUVIO_MEDIA_TEST=1 npm --prefix companion test
      - run: npx playwright install --with-deps chromium
      - name: Browser verification with generated media and test-only Nuvio authentication
        env:
          COMPANION_DEV_URL: http://127.0.0.1:4311
        run: |
          node companion/tests/browser-server.ts > /tmp/nuvio-fixtures.log 2>&1 &
          fixtures_pid=$!
          npm run dev -- --port 4175 --strictPort > /tmp/nuvio-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$fixtures_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4311/healthz >/dev/null && curl -fsS http://localhost:4175/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test
      - name: Verify the built PWA and offline cache boundaries
        run: |
          npm run preview -- --port 4181 --strictPort > /tmp/nuvio-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4181/ >/dev/null; then break; fi
            sleep 1
          done
          NUVIO_PRODUCTION_URL=http://localhost:4181 npx playwright test tests/browser/production.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
      - name: Build production-equivalent images and test the stack
        run: |
          docker build -f companion/Dockerfile --target test -t nuvio-companion-tests:ci .
          docker build -f companion/Dockerfile -t nuvio-companion:ci .
          docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t nuvio-web:ci .
          node scripts/docker-smoke.mjs
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.repository != 'lucaboox/nuvio-web' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: names
        shell: bash
        run: |
          printf 'prefix=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.prefix }}-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - id: companion-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.prefix }}-companion
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: companion/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.companion-meta.outputs.tags }}
          labels: ${{ steps.companion-meta.outputs.labels }}
      - name: Generate one-file installer using the actual repository and immutable commit tag
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: node scripts/generate-zima-compose.mjs && docker compose -f docker-compose.zima.yml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: zimaos-installer
          path: docker-compose.zima.yml
